name: Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /root/silver-octo-spork

            PREV_COMMIT=$(git rev-parse HEAD)

            git remote set-url origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/socratic-pro/silver-octo-spork.git
            git fetch origin master
            git reset --hard origin/master
            git remote set-url origin https://github.com/socratic-pro/silver-octo-spork.git

            .venv/bin/pip install -r requirements.txt --quiet

            systemctl restart jobboard

            for i in 1 2 3 4 5; do
              sleep 3
              if curl -sf http://127.0.0.1:8000/health > /dev/null 2>&1; then
                echo "Health check passed"
                break
              fi
              echo "Health check attempt $i failed, retrying..."
              if [ $i -eq 5 ]; then
                echo "Health check failed after 5 attempts, rolling back to $PREV_COMMIT"
                git reset --hard "$PREV_COMMIT"
                .venv/bin/pip install -r requirements.txt --quiet
                systemctl restart jobboard
                exit 1
              fi
            done

            echo "Deployed successfully: $(git rev-parse --short HEAD)"
